<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobren Transportes | Ordem de Coleta</title>
    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #003366; /* Azul escuro corporativo */
            --secondary-color: #f8f9fa;
            --accent-color: #ffcc00; /* Amarelo para detalhes de atenção */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 { margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        .header p { margin: 5px 0 0; opacity: 0.8; }

        .form-body { padding: 30px; }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-color);
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: 20px;
            padding-bottom: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width { grid-column: span 2; }

        label { display: block; font-size: 12px; margin-bottom: 5px; color: #666; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus { border-color: var(--primary-color); outline: none; }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        button:hover { background-color: #002244; }

        .loading { color: #007bff; font-size: 12px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Jobren Transportes</h1>
        <p>Sistema de Emissão de Ordem de Coleta</p>
    </div>

    <div class="form-body">
        <div class="section-title">Dados do Remetente</div>
        <div class="grid">
            <div class="full-width">
                <label>CNPJ (Apenas números)</label>
                <input type="text" id="cnpj" placeholder="00.000.000/0000-00" onblur="buscarCNPJ()">
                <span id="aviso" class="loading">Buscando dados...</span>
            </div>
            <div class="full-width">
                <label>Razão Social</label>
                <input type="text" id="razao_social" readonly>
            </div>
            <div class="full-width">
                <label>Endereço Completo</label>
                <input type="text" id="endereco" readonly>
            </div>
        </div>

        <div class="section-title" style="margin-top: 30px;">Detalhes da Carga</div>
        <div class="grid">
            <div>
                <label>Peso Estimado (kg)</label>
                <input type="number" id="peso" placeholder="Ex: 150">
            </div>
            <div>
                <label>Qtd de Volumes</label>
                <input type="number" id="volumes" placeholder="Ex: 5">
            </div>
            <div class="full-width">
                <label>Observações / Tipo de Mercadoria</label>
                <input type="text" id="obs" placeholder="Ex: Caixas de eletrônicos">
            </div>
        </div>

        <button onclick="enviarParaSupabase()">Confirmar e Salvar Coleta</button>
    </div>
</div>

<script>
    // Substitua pelos seus dados do painel do Supabase
    const SUPABASE_URL = 'SUA_URL_DO_SUPABASE';
    const SUPABASE_KEY = 'SUA_CHAVE_ANON_DO_SUPABASE';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function buscarCNPJ() {
        const cnpj = document.getElementById('cnpj').value.replace(/\D/g, '');
        const aviso = document.getElementById('aviso');
        
        if (cnpj.length === 14) {
            aviso.style.display = 'block';
            try {
                const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
                const data = await response.json();
                
                if (data.razao_social) {
                    document.getElementById('razao_social').value = data.razao_social;
                    document.getElementById('endereco').value = `${data.logradouro}, ${data.numero} - ${data.bairro}, ${data.municipio}/${data.uf}`;
                }
            } catch (error) {
                alert("Erro ao buscar CNPJ. Verifique a conexão.");
            } finally {
                aviso.style.display = 'none';
            }
        }
    }

    async function enviarParaSupabase() {
        const dados = {
            cnpj: document.getElementById('cnpj').value,
            razao_social: document.getElementById('razao_social').value,
            endereco: document.getElementById('endereco').value,
            peso: document.getElementById('peso').value,
            volumes: document.getElementById('volumes').value,
            observacao: document.getElementById('obs').value,
            empresa: 'Jobren Transportes',
            data_criacao: new Date()
        };

        if(!dados.cnpj || !dados.peso) {
            alert("Por favor, preencha os campos principais.");
            return;
        }

        const { error } = await _supabase.from('coletas').insert([dados]);

        if (error) {
            console.error(error);
            alert("Erro ao salvar no banco de dados.");
        } else {
            alert("Ordem de Coleta registrada com sucesso para Jobren Transportes!");
            location.reload(); // Limpa o formulário
        }
    }
</script>

</body>
</html>
