<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobren Transportes | Sistema de Coleta</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --blue: #003366; --black: #1a1a1a; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #1e272e; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #ordem-documento { width: 210mm; min-height: 297mm; background: white; padding: 12mm; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; border-bottom: 4px solid var(--blue); padding-bottom: 15px; margin-bottom: 20px; }
        .brand h1 { margin: 0; color: var(--blue); font-size: 28px; text-transform: uppercase; }
        .id-box { background: var(--black); color: white; padding: 12px 25px; border-radius: 4px; text-align: center; }
        .bar { background: var(--blue); color: white; padding: 8px 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid #000; margin-bottom: 5px; }
        .cell { padding: 6px; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; }
        label { font-size: 8px; font-weight: bold; color: var(--blue); text-transform: uppercase; }
        input, textarea { border: none; outline: none; font-size: 11px; background: transparent; width: 100%; }
        .actions { position: fixed; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 15px 25px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }
        .btn-save { background: #27ae60; }
    </style>
</head>
<body>

<div class="actions">
    <button class="btn btn-save" onclick="salvarTudo()">💾 SALVAR DADOS E PDF</button>
</div>

<div id="ordem-documento">
    <div class="header">
        <div class="brand">
            <h1>JOBREN TRANSPORTES</h1>
            <p>RUA DR VIDAL REIS , 515 - PQ NOVO MUNDO - SP</p>
            <p>CNPJ: 53.566.595/0001-03</p>
        </div>
        <div class="id-box">
            <span>Ordem de Coleta</span>
            <h2 id="num_id">00000</h2>
        </div>
    </div>

    <div class="grid">
        <div class="cell span-2"><label>Data Inicial</label><input type="datetime-local" id="dt_ini"></div>
        <div class="cell span-2"><label>Data Final</label><input type="datetime-local" id="dt_fim"></div>
        <div class="cell span-2"><label>Previsão</label><input type="date" id="dt_ent"></div>
    </div>

    <div class="bar">1. Remetente</div>
    <div class="grid">
        <div class="cell span-2"><label>CNPJ (Somente Números)</label><input type="text" id="rem_cnpj" onblur="fetchCompany('rem')" maxlength="14"></div>
        <div class="cell span-4"><label>Razão Social</label><input type="text" id="rem_nome" readonly></div>
        <div class="cell span-6"><label>Endereço</label><input type="text" id="rem_end" readonly></div>
    </div>

    <div class="bar">2. Destinatário</div>
    <div class="grid">
        <div class="cell span-2"><label>CNPJ (Somente Números)</label><input type="text" id="dest_cnpj" onblur="fetchCompany('dest')" maxlength="14"></div>
        <div class="cell span-4"><label>Razão Social</label><input type="text" id="dest_nome" readonly></div>
        <div class="cell span-6"><label>Endereço</label><input type="text" id="dest_end" readonly></div>
    </div>

    <div class="bar">3. Carga</div>
    <div class="grid">
        <div class="cell"><label>Volumes</label><input type="number" id="vols"></div>
        <div class="cell"><label>Peso</label><input type="text" id="peso"></div>
        <div class="cell span-4"><label>NF-e</label><input type="text" id="nfe"></div>
    </div>

    <div class="bar">4. Observações</div>
    <div class="grid"><div class="cell span-6"><textarea id="obs_geral" rows="4"></textarea></div></div>
</div>

<script>
    const S_URL = 'https://mcspwmajxfjzqfoxzvqu.supabase.co';
    const S_KEY = 'sb_publishable_QJG8VV2XRNfghNiylDQWcg_zUS8kQvE';
    const supabaseClient = supabase.createClient(S_URL, S_KEY);

    function reset() {
        document.getElementById('num_id').innerText = Math.floor(10000 + Math.random() * 90000);
        document.querySelectorAll('input, textarea').forEach(i => i.value = "");
        const agora = new Date().toISOString();
        document.getElementById('dt_ini').value = agora.slice(0,16);
    }

    // NOVA FUNÇÃO DE BUSCA CNPJ MELHORADA
    async function fetchCompany(tipo) {
        const campoCnpj = document.getElementById(tipo + '_cnpj');
        const cnpj = campoCnpj.value.replace(/\D/g, '');
        
        if (cnpj.length !== 14) {
            limparCamposEndereco(tipo);
            return;
        }

        // Feedback visual de carregamento
        document.getElementById(tipo + '_nome').value = "Buscando...";

        try {
            const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
            
            if (!res.ok) throw new Error('Não encontrado');
            
            const data = await res.json();

            document.getElementById(tipo + '_nome').value = data.razao_social || data.nome_fantasia || "Não informado";
            document.getElementById(tipo + '_end').value = `${data.logradouro}, ${data.numero} - ${data.bairro}, ${data.municipio}/${data.uf}`;
            
        } catch (e) {
            alert("CNPJ não encontrado ou erro no sistema de busca.");
            limparCamposEndereco(tipo);
        }
    }

    function limparCamposEndereco(tipo) {
        document.getElementById(tipo + '_nome').value = "";
        document.getElementById(tipo + '_end').value = "";
    }

    async function salvarTudo() {
        const num = document.getElementById('num_id').innerText;
        const fileName = `coleta_${num}.pdf`;

        try {
            const element = document.getElementById('ordem-documento');
            const pdfBlob = await html2pdf().set({ margin: 0, filename: fileName, html2canvas: { scale: 2 } }).from(element).output('blob');

            await supabaseClient.storage.from('documentos_coleta').upload(`pdf/${fileName}`, pdfBlob, { contentType: 'application/pdf', upsert: true });

            const { data: urlData } = supabaseClient.storage.from('documentos_coleta').getPublicUrl(`pdf/${fileName}`);

            const { error: dbError } = await supabaseClient.from('coletas_pro').insert([{
                numero_coleta: parseInt(num),
                rem_cnpj: document.getElementById('rem_cnpj').value,
                rem_nome: document.getElementById('rem_nome').value,
                dest_cnpj: document.getElementById('dest_cnpj').value,
                dest_nome: document.getElementById('dest_nome').value,
                empresa_log: 'Jobren Transportes',
                url_documento: urlData.publicUrl
            }]);

            if (dbError) throw dbError;

            alert("✅ Salvo com sucesso!");
            reset();

        } catch (err) {
            alert("Erro ao processar: " + err.message);
        }
    }

    window.onload = reset;
</script>
</body>
</html>
