<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobren Transportes | Emissor Profissional</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --blue: #003366; --black: #1a1a1a; --gold: #ffcc00; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #1e272e; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #ordem-documento { width: 100%; max-width: 210mm; min-height: 297mm; background: white; padding: 12mm; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        .header { display: flex; justify-content: space-between; border-bottom: 4px solid var(--blue); padding-bottom: 15px; margin-bottom: 20px; }
        .brand h1 { margin: 0; color: var(--blue); font-size: 28px; font-weight: 800; text-transform: uppercase; }
        .brand p { margin: 2px 0; font-size: 11px; color: #333; font-weight: 600; }
        
        .id-box { background: var(--black); color: white; padding: 12px 25px; border-radius: 4px; text-align: center; }
        .id-box span { font-size: 10px; color: var(--gold); text-transform: uppercase; }
        .id-box h2 { margin: 0; font-size: 26px; }

        .bar { background: var(--blue); color: white; padding: 8px 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid #000; margin-bottom: 5px; }
        .cell { padding: 6px; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; }
        .cell:last-child { border-right: none; }
        
        .span-6 { grid-column: span 6; } .span-3 { grid-column: span 3; } .span-2 { grid-column: span 2; }
        
        label { font-size: 8px; font-weight: 800; color: var(--blue); text-transform: uppercase; margin-bottom: 2px; }
        input { border: none; outline: none; font-size: 11px; color: #000; font-family: inherit; background: transparent; width: 100%; }
        
        .actions { position: fixed; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .btn { padding: 15px 25px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s; }
        .btn-save { background: #27ae60; } 
        .btn-pdf { background: var(--blue); }
        .btn:hover { opacity: 0.8; transform: scale(1.05); }

        @media print { .actions { display: none; } #ordem-documento { box-shadow: none; padding: 0; } }
    </style>
</head>
<body>

<div class="actions">
    <button class="btn btn-save" onclick="salvarBanco()">💾 SALVAR NO BANCO</button>
    <button class="btn btn-pdf" onclick="gerarPDF()">📄 GERAR PDF</button>
</div>

<div id="ordem-documento">
    <div class="header">
        <div class="brand">
            <h1>JOBREN TRANSPORTES</h1>
            <p>RUA THOMAS LOSITO, 8 - PQ NOVO MUNDO - SAO PAULO/SP</p>
            <p>CNPJ: 53.566.595/0001-03 | FONE: (11) 98111-6990</p>
        </div>
        <div class="id-box">
            <span>Ordem de Coleta</span>
            <h2 id="num_id">00000</h2>
        </div>
    </div>

    <div class="grid">
        <div class="cell span-2"><label>Data/Hora Inicial</label><input type="datetime-local" id="dt_ini"></div>
        <div class="cell span-2"><label>Data/Hora Final</label><input type="datetime-local" id="dt_fim"></div>
        <div class="cell span-2"><label>Previsão Entrega</label><input type="date" id="dt_ent"></div>
    </div>

    <div class="bar">1. Dados do Remetente</div>
    <div class="grid">
        <div class="cell span-2"><label>CNPJ/CPF</label><input type="text" id="rem_cnpj" onblur="fetchCompany('rem')"></div>
        <div class="cell span-4"><label>Razão Social</label><input type="text" id="rem_nome"></div>
        <div class="cell span-6"><label>Endereço</label><input type="text" id="rem_end"></div>
    </div>

    <div class="bar">2. Dados do Destinatário</div>
    <div class="grid">
        <div class="cell span-2"><label>CNPJ/CPF</label><input type="text" id="dest_cnpj" onblur="fetchCompany('dest')"></div>
        <div class="cell span-4"><label>Razão Social</label><input type="text" id="dest_nome"></div>
        <div class="cell span-6"><label>Endereço</label><input type="text" id="dest_end"></div>
    </div>

    <div class="bar">3. Carga e Logística</div>
    <div class="grid">
        <div class="cell"><label>Volumes</label><input type="number" id="vols" value="1"></div>
        <div class="cell"><label>Peso (KG)</label><input type="text" id="peso" value="0.00"></div>
        <div class="cell"><label>Valor NFs</label><input type="text" id="val_nfs" value="0.00"></div>
        <div class="cell span-3"><label>Números NF-e</label><input type="text" id="nfe"></div>
    </div>
</div>

<script>
    const URL = 'https://mcspwmajxfjzqfoxzvqu.supabase.co';
    const KEY = 'sb_publishable_QJG8VV2XRNfghNiylDQWcg_zUS8kQvE';
    let _supabase = null;

    // Inicialização ao carregar a página
    window.onload = () => {
        try {
            _supabase = supabase.createClient(URL, KEY);
            
            // 1. GERA O NÚMERO ALEATÓRIO IMEDIATAMENTE
            const numeroAleatorio = Math.floor(10000 + Math.random() * 90000);
            document.getElementById('num_id').innerText = numeroAleatorio;
            
            // 2. CONFIGURA AS DATAS (CALENDÁRIO)
            const agora = new Date();
            const dataLocal = agora.toISOString().slice(0, 16);
            const dataApenas = agora.toISOString().slice(0, 10);
            
            document.getElementById('dt_ini').value = dataLocal;
            document.getElementById('dt_fim').value = dataLocal;
            document.getElementById('dt_ent').value = dataApenas;
            
        } catch (e) {
            console.error("Erro ao iniciar Supabase:", e);
        }
    };

    async function fetchCompany(tipo) {
        const cnpj = document.getElementById(tipo + '_cnpj').value.replace(/\D/g, '');
        if (cnpj.length < 14) return;
        try {
            const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
            const data = await res.json();
            if (data.razao_social) {
                document.getElementById(tipo + '_nome').value = data.razao_social;
                document.getElementById(tipo + '_end').value = `${data.logradouro}, ${data.numero} - ${data.bairro}`;
            }
        } catch (e) { console.error("Erro na busca do CNPJ"); }
    }

    async function salvarBanco() {
        if (!_supabase) {
            _supabase = supabase.createClient(URL, KEY);
        }

        const numeroColeta = document.getElementById('num_id').innerText;
        
        const dados = {
            numero_coleta: numeroColeta,
            rem_nome: document.getElementById('rem_nome').value,
            dest_nome: document.getElementById('dest_nome').value,
            nf_numero: document.getElementById('nfe').value,
            data_criacao: new Date().toISOString(),
            empresa_emitente: 'Jobren Transportes'
        };
        
        try {
            const { error } = await _supabase.from('coletas_pro').insert([dados]);
            if (error) {
                alert("❌ Erro ao salvar no banco: " + error.message);
            } else {
                alert("✅ Ordem de Coleta #" + numeroColeta + " salva com sucesso!");
            }
        } catch (err) {
            alert("❌ Falha crítica de conexão.");
        }
    }

    function gerarPDF() {
        const el = document.getElementById('ordem-documento');
        const num = document.getElementById('num_id').innerText;
        
        const opt = {
            margin: 0,
            filename: `Jobren_Coleta_${num}.pdf`,
            html2canvas: { scale: 3 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(el).save().then(() => {
            alert("PDF gerado com sucesso!");
        });
    }
</script>
</body>
</html>
