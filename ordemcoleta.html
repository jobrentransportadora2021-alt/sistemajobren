<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobren Transportes | Ordem de Coleta</title>
    <link rel="icon" href="data:,">
    
    <!-- SDKs Necessários -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --primary: #003366; --accent: #ffcc00; --bg: #e9ecef; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        #ordem-documento { max-width: 850px; margin: auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; padding-bottom: 20px; }
        .header { background-color: var(--primary); color: white; padding: 25px; text-align: center; border-bottom: 5px solid var(--accent); }
        .form-body { padding: 30px; }
        .section-title { font-size: 13px; font-weight: bold; color: var(--primary); text-transform: uppercase; border-left: 4px solid var(--accent); padding-left: 10px; margin: 25px 0 15px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full { grid-column: span 2; }
        label { display: block; font-size: 11px; margin-bottom: 5px; color: #555; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 18px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-download { background-color: #007bff; margin-top: 20px; }
        .loading { color: #007bff; font-size: 11px; display: none; font-weight: normal; }
        
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div id="ordem-documento">
    <div class="header">
        <h1>Jobren Transportes</h1>
        <p>Ordem de Coleta de Mercadorias</p>
    </div>

    <div class="form-body">
        <div class="section-title">1. Remetente</div>
        <div class="grid">
            <div class="full">
                <label>CNPJ</label>
                <input type="text" id="rem_cnpj" placeholder="00000000000000" onblur="buscarEmpresa('rem')">
                <span id="load_rem" class="loading">Buscando dados...</span>
            </div>
            <div class="full"><label>Razão Social</label><input type="text" id="rem_nome" readonly></div>
            <div class="full"><label>Endereço</label><input type="text" id="rem_end" readonly></div>
        </div>

        <div class="section-title">2. Destinatário</div>
        <div class="grid">
            <div class="full">
                <label>CNPJ</label>
                <input type="text" id="dest_cnpj" placeholder="00000000000000" onblur="buscarEmpresa('dest')">
                <span id="load_dest" class="loading">Buscando dados...</span>
            </div>
            <div class="full"><label>Razão Social</label><input type="text" id="dest_nome" readonly></div>
            <div class="full"><label>Endereço</label><input type="text" id="dest_end" readonly></div>
        </div>

        <div class="section-title">3. Dados da Carga</div>
        <div class="grid">
            <div><label>Nota Fiscal (NF-e)</label><input type="text" id="nf_numero"></div>
            <div><label>Peso (KG)</label><input type="number" id="peso"></div>
            <div><label>Volumes</label><input type="number" id="volumes"></div>
            <div><label>Valor (R$)</label><input type="text" id="valor"></div>
            <div class="full"><label>Observações</label><textarea id="obs" rows="2"></textarea></div>
        </div>

        <div class="no-print">
            <button onclick="enviarParaSupabase()">SALVAR NO BANCO</button>
            <button class="btn-download" onclick="baixarPDF()">BAIXAR PDF DA ORDEM</button>
        </div>
    </div>
</div>

<script>
    var _supabase = null;
    
    // Suas chaves configuradas corretamente
    var SUPABASE_URL = 'https://mcspwmajxfjzqfoxzvqu.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_QJG8VV2XRNfghNiylDQWcg_zUS8kQvE';

    window.onload = function() {
        if (typeof supabase !== 'undefined') {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log("Supabase inicializado com sucesso.");
        } else {
            console.error("Erro: SDK do Supabase não foi carregado.");
        }
    };

    async function buscarEmpresa(tipo) {
        var cnpj = document.getElementById(tipo + '_cnpj').value.replace(/\D/g, '');
        if (cnpj.length !== 14) return;
        
        document.getElementById('load_' + tipo).style.display = 'inline';
        try {
            var res = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + cnpj);
            var d = await res.json();
            if (d.razao_social) {
                document.getElementById(tipo + '_nome').value = d.razao_social;
                document.getElementById(tipo + '_end').value = d.logradouro + ', ' + d.numero + ' - ' + d.municipio + '/' + d.uf;
            } else {
                alert("CNPJ não encontrado.");
            }
        } catch (e) { 
            console.error(e);
            alert("Erro ao consultar CNPJ.");
        }
        document.getElementById('load_' + tipo).style.display = 'none';
    }

    async function enviarParaSupabase() {
        if (!_supabase) {
            alert("Erro: Sistema de banco de dados não inicializado.");
            return;
        }

        var dados = {
            rem_cnpj: document.getElementById('rem_cnpj').value,
            rem_nome: document.getElementById('rem_nome').value,
            dest_cnpj: document.getElementById('dest_cnpj').value,
            dest_nome: document.getElementById('dest_nome').value,
            nf_numero: document.getElementById('nf_numero').value,
            peso: document.getElementById('peso').value,
            volumes: document.getElementById('volumes').value,
            observacao: document.getElementById('obs').value,
            empresa_emitente: 'Jobren Transportes',
            data_criacao: new Date().toISOString()
        };

        if (!dados.rem_cnpj || !dados.nf_numero) {
            alert("Por favor, preencha o CNPJ do remetente e o número da NF.");
            return;
        }

        try {
            var { error } = await _supabase.from('coletas_pro').insert([dados]);
            if (error) throw error;
            alert("Ordem salva com sucesso no banco de dados!");
        } catch (e) { 
            console.error(e);
            alert("Erro ao salvar: " + e.message); 
        }
    }

    function baixarPDF() {
        var elemento = document.getElementById('ordem-documento');
        var nf = document.getElementById('nf_numero').value || "S-NF";
        
        var botoes = document.querySelector('.no-print');
        botoes.style.visibility = 'hidden'; // Esconde os botões sem mudar o layout
        
        var opcoes = {
            margin: 10,
            filename: 'Jobren_Ordem_NF_' + nf + '.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opcoes).from(elemento).save().then(() => {
            botoes.style.visibility = 'visible'; // Mostra os botões de volta
        });
    }
</script>
</body>
</html>
