<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobren Transportes | Ordem de Coleta</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --primary: #003366; --accent: #ffcc00; --border: #000; }
        
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; margin: 0; padding: 20px; }

        /* Estilo Folha A4 */
        #ordem-documento { 
            width: 210mm; /* Largura padrão A4 */
            min-height: 297mm;
            margin: auto; 
            background: white; 
            padding: 15mm;
            box-sizing: border-box;
            border: 1px solid #ccc;
        }

        /* Cabeçalho Robusto */
        .header { 
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #fff;
        }
        .header h1 { margin: 0; font-size: 24px; color: var(--primary); font-weight: bold; }
        .header p { margin: 5px 0 0; font-size: 14px; font-weight: bold; text-transform: uppercase; }

        /* Seções Estilo Formulário */
        .section {
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .section-title { 
            background-color: #eeeeee;
            border-bottom: 1px solid var(--border);
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .row { display: flex; border-bottom: 1px solid #eee; }
        .row:last-child { border-bottom: none; }
        
        .col { 
            padding: 8px 10px; 
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }
        .col:last-child { border-right: none; }
        
        label { 
            font-size: 9px; 
            color: #444; 
            font-weight: bold; 
            text-transform: uppercase;
            margin-bottom: 3px;
        }
        
        input, textarea { 
            border: none; 
            font-size: 13px; 
            width: 100%; 
            outline: none;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        /* Botões flutuantes para não atrapalhar o PDF */
        .no-print-area {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }
        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-save { background: #28a745; }
        .btn-pdf { background: #007bff; }

        /* Ajustes específicos para o PDF */
        @media print {
            body { background: none; padding: 0; }
            #ordem-documento { border: none; margin: 0; padding: 10mm; }
            .no-print-area { display: none !important; }
        }
    </style>
</head>
<body>

<div id="ordem-documento">
    <div class="header">
        <h1>JOBREN TRANSPORTES LTDA</h1>
        <p>DOCUMENTO AUXILIAR DE ORDEM DE COLETA</p>
    </div>

    <div class="section">
        <div class="section-title">1. Dados do Remetente (Origem)</div>
        <div class="row">
            <div class="col" style="flex: 1;"><label>CNPJ/CPF</label><input type="text" id="rem_cnpj" value="53566595000103" onblur="buscarEmpresa('rem')"></div>
            <div class="col" style="flex: 2;"><label>Razão Social</label><input type="text" id="rem_nome" value="JOBREN TRANSPORTES LTDA"></div>
        </div>
        <div class="row">
            <div class="col" style="flex: 1;"><label>Endereço de Coleta</label><input type="text" id="rem_end" value="DR VIDAL REIS, 515 PARQUE NOVO MUNDO, SAO PAULO/SP"></div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">2. Dados do Destinatário (Destino)</div>
        <div class="row">
            <div class="col" style="flex: 1;"><label>CNPJ/CPF</label><input type="text" id="dest_cnpj" value="53566595000103" onblur="buscarEmpresa('dest')"></div>
            <div class="col" style="flex: 2;"><label>Razão Social</label><input type="text" id="dest_nome" value="JOBREN TRANSPORTES LTDA"></div>
        </div>
        <div class="row">
            <div class="col" style="flex: 1;"><label>Endereço de Entrega</label><input type="text" id="dest_end"></div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">3. Detalhes da Carga</div>
        <div class="row">
            <div class="col" style="flex: 1;"><label>Nota Fiscal (NF-e)</label><input type="text" id="nf_numero" placeholder="Ex: 123456"></div>
            <div class="col" style="flex: 1;"><label>Valor Mercadoria</label><input type="text" id="valor" placeholder="R$ 0,00"></div>
        </div>
        <div class="row">
            <div class="col" style="flex: 1;"><label>Peso Total (KG)</label><input type="number" id="peso"></div>
            <div class="col" style="flex: 1;"><label>Qtd Volumes</label><input type="number" id="volumes"></div>
        </div>
        <div class="row">
            <div class="col" style="flex: 1;"><label>Observações</label><textarea id="obs" rows="4"></textarea></div>
        </div>
    </div>
</div>

<div class="no-print-area">
    <button class="btn btn-save" onclick="enviarParaSupabase()">SALVAR NO BANCO</button>
    <button class="btn btn-pdf" onclick="baixarPDF()">GERAR PDF PROFISSIONAL</button>
</div>

<script>
    // Inicialização Supabase
    var _supabase = null;
    const SUPABASE_URL = 'https://mcspwmajxfjzqfoxzvqu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QJG8VV2XRNfghNiylDQWcg_zUS8kQvE';

    window.onload = function() {
        if (typeof supabase !== 'undefined') {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
    };

    // Funções de Busca, Envio e PDF (Mantidas e otimizadas)
    function baixarPDF() {
        const elemento = document.getElementById('ordem-documento');
        const nf = document.getElementById('nf_numero').value || "S_NF";
        
        const opcoes = {
            margin: 0,
            filename: `OC_Jobren_NF_${nf}.pdf`,
            image: { type: 'jpeg', quality: 1 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opcoes).from(elemento).save();
    }

    async function buscarEmpresa(tipo) {
        var cnpj = document.getElementById(tipo + '_cnpj').value.replace(/\D/g, '');
        if (cnpj.length !== 14) return;
        try {
            var res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
            var d = await res.json();
            if (d.razao_social) {
                document.getElementById(tipo + '_nome').value = d.razao_social;
                document.getElementById(tipo + '_end').value = `${d.logradouro}, ${d.numero} - ${d.municipio}/${d.uf}`;
            }
        } catch (e) { console.error(e); }
    }

    async function enviarParaSupabase() {
        if (!_supabase) return alert("Erro de conexão.");
        var dados = {
            rem_cnpj: document.getElementById('rem_cnpj').value,
            rem_nome: document.getElementById('rem_nome').value,
            dest_cnpj: document.getElementById('dest_cnpj').value,
            dest_nome: document.getElementById('dest_nome').value,
            nf_numero: document.getElementById('nf_numero').value,
            peso: document.getElementById('peso').value,
            volumes: document.getElementById('volumes').value,
            observacao: document.getElementById('obs').value,
            empresa_emitente: 'Jobren Transportes',
            data_criacao: new Date().toISOString()
        };
        try {
            const { error } = await _supabase.from('coletas_pro').insert([dados]);
            if (error) throw error;
            alert("Ordem salva com sucesso!");
        } catch (e) { alert("Erro: " + e.message); }
    }
</script>
</body>
</html>
