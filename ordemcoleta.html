<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobren Transportes | Ordem de Coleta Profissional</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #003366; --accent: #ffcc00; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); overflow: hidden; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--accent); }
        .form-body { padding: 25px; }
        .section { margin-bottom: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .section-title { grid-column: span 2; font-weight: bold; color: var(--primary); border-left: 4px solid var(--accent); padding-left: 10px; margin-bottom: 10px; text-transform: uppercase; font-size: 13px; }
        .full { grid-column: span 2; }
        label { display: block; font-size: 11px; color: #555; margin-bottom: 4px; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: var(--primary); outline: none; background: #f9f9f9; }
        .btn-enviar { width: 100%; padding: 18px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-enviar:hover { background: #218838; transform: translateY(-2px); }
        .loading-text { font-size: 10px; color: #007bff; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">JOBREN TRANSPORTES</h1>
        <span style="font-size: 12px; opacity: 0.9;">Módulo de Coleta Inteligente</span>
    </div>

    <div class="form-body">
        <!-- REMETENTE -->
        <div class="section">
            <div class="section-title">1. Dados do Remetente (Origem)</div>
            <div class="full">
                <label>CNPJ REMETENTE</label>
                <input type="text" id="rem_cnpj" placeholder="Busca automática..." onblur="buscarEmpresa('rem')">
                <span id="load_rem" class="loading-text">Consultando base de dados...</span>
            </div>
            <div class="full"><label>RAZÃO SOCIAL</label><input type="text" id="rem_nome" readonly></div>
            <div class="full"><label>ENDEREÇO DE COLETA</label><input type="text" id="rem_end" readonly></div>
        </div>

        <!-- DESTINATÁRIO -->
        <div class="section">
            <div class="section-title">2. Dados do Destinatário (Entrega)</div>
            <div class="full">
                <label>CNPJ DESTINATÁRIO</label>
                <input type="text" id="dest_cnpj" placeholder="Busca automática..." onblur="buscarEmpresa('dest')">
                <span id="load_dest" class="loading-text">Consultando base de dados...</span>
            </div>
            <div class="full"><label>RAZÃO SOCIAL</label><input type="text" id="dest_nome" readonly></div>
            <div class="full"><label>ENDEREÇO DE ENTREGA</label><input type="text" id="dest_end" readonly></div>
        </div>

        <!-- DADOS DA CARGA -->
        <div class="section">
            <div class="section-title">3. Informações da Carga e Documentação</div>
            <div><label>NÚMERO DA NF-e</label><input type="text" id="nf_numero" placeholder="Ex: 12345"></div>
            <div><label>PESO TOTAL (KG)</label><input type="number" id="peso" placeholder="0.00"></div>
            <div><label>VOLUMES</label><input type="number" id="volumes" placeholder="Ex: 10"></div>
            <div><label>VALOR DA MERCADORIA (R$)</label><input type="text" id="valor" placeholder="Ex: 1.500,00"></div>
            <div class="full">
                <label>OBSERVAÇÕES DA ORDEM</label>
                <textarea id="obs" rows="3" placeholder="Instruções especiais de coleta ou entrega..."></textarea>
            </div>
        </div>

        <button class="btn-enviar" onclick="enviarDados()">GERAR ORDEM DE COLETA</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'SUA_URL';
    const SUPABASE_KEY = 'SUA_CHAVE';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function buscarEmpresa(tipo) {
        const cnpj = document.getElementById(`${tipo}_cnpj`).value.replace(/\D/g, '');
        if (cnpj.length !== 14) return;

        document.getElementById(`load_${tipo}`).style.display = 'block';

        try {
            const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
            const d = await res.json();
            if (d.razao_social) {
                document.getElementById(`${tipo}_nome`).value = d.razao_social;
                document.getElementById(`${tipo}_end`).value = `${d.logradouro}, ${d.numero} - ${d.municipio}/${d.uf}`;
            }
        } catch (e) { console.error("Erro na busca"); }
        document.getElementById(`load_${tipo}`).style.display = 'none';
    }

    async function enviarDados() {
        const dados = {
            rem_cnpj: document.getElementById('rem_cnpj').value,
            rem_nome: document.getElementById('rem_nome').value,
            dest_cnpj: document.getElementById('dest_cnpj').value,
            dest_nome: document.getElementById('dest_nome').value,
            nf_numero: document.getElementById('nf_numero').value,
            peso: document.getElementById('peso').value,
            volumes: document.getElementById('volumes').value,
            observacao: document.getElementById('obs').value,
            empresa_log: 'Jobren Transportes'
        };

        const { error } = await _supabase.from('coletas_pro').insert([dados]);
        if (error) alert("Erro ao salvar!");
        else {
            alert("Ordem salva com sucesso!");
            window.print(); // Opcional: abre a tela de impressão estilo comprovante
        }
    }
</script>
</body>
</html>
