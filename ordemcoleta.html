<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobren Transportes | Gestão de Coletas</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; }
        body { font-family: Arial, sans-serif; background-color: #0f172a; margin: 0; padding: 20px; color: white; }
        
        .container { display: flex; flex-direction: column; align-items: center; gap: 20px; }

        /* Estilo da Busca */
        .search-container {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .search-box { display: flex; gap: 10px; margin-top: 10px; }
        .search-box input { flex: 1; padding: 12px; border-radius: 6px; border: none; font-size: 16px; }
        .btn-search { background: #3b82f6; color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Tabela de Resultados */
        #lista-coletas {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            display: none; /* Esconde até ter resultados */
        }
        #lista-coletas th, #lista-coletas td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        #lista-coletas th { background: #334155; font-size: 12px; text-transform: uppercase; }
        .btn-download { background: #22c55e; color: white; text-decoration: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }

        /* O Documento (mantido igual para geração) */
        #ordem-documento { 
            width: 210mm; height: 297mm; background: white; padding: 10mm; color: black;
            display: block; /* Mude para none se quiser ver só a busca no início */
        }
        /* ... (mesmo CSS anterior do documento) ... */
        .header { display: flex; justify-content: space-between; border-bottom: 4px solid #002347; padding-bottom: 10px; margin-bottom: 10px; }
        .id-box { background: #1a1a1a; color: white; padding: 10px 20px; text-align: center; border-right: 5px solid #003366; }
        .bar { background: #002347; color: white; padding: 6px 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin: 10px 0 3px 0; }
        table.doc-table { width: 100%; border-collapse: collapse; margin-bottom: 2px; table-layout: fixed; }
        table.doc-table td { border: 1px solid #ccc; padding: 5px 8px; vertical-align: top; }
        label { display: block; font-size: 8px; font-weight: 800; color: #003366; text-transform: uppercase; }
        input.doc-input, textarea.doc-input { width: 100%; border: none; outline: none; font-size: 12px; font-weight: bold; background: transparent; }

        .actions { position: fixed; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="search-container">
        <label style="color: #94a3b8;">Localizar Ordem de Coleta Salva:</label>
        <div class="search-box">
            <input type="text" id="busca_cnpj" placeholder="Digite o CNPJ ou Número da Coleta...">
            <button class="btn-search" onclick="buscarOrdens()">🔍 BUSCAR</button>
        </div>
        
        <table id="lista-coletas" style="margin-top: 20px;">
            <thead>
                <tr>
                    <th>Nº Ordem</th>
                    <th>Remetente</th>
                    <th>Destinatário</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="resultado_busca"></tbody>
        </table>
    </div>

    <div class="actions">
        <button class="btn" style="background: #22c55e;" onclick="salvarBancoCompleto()">💾 SALVAR NOVO</button>
        <button class="btn" style="background: #3b82f6;" onclick="gerarPDF()">📄 GERAR PDF ATUAL</button>
    </div>

    <div id="ordem-documento">
        <div class="header">
            <div class="brand">
                <h1 style="margin:0; color:#002347;">JOBREN TRANSPORTES</h1>
                <p style="font-size:10px; margin:2px 0;">RUA DR VIDAL REIS, 515 - PQ NOVO MUNDO - SP</p>
            </div>
            <div class="id-box">
                <span style="font-size:9px;">ORDEM DE COLETA</span>
                <h2 id="num_id" style="margin:0;">00000</h2>
            </div>
        </div>

        <table class="doc-table">
            <tr>
                <td><label>Data Inicial</label><input type="datetime-local" id="dt_ini" class="doc-input"></td>
                <td><label>Data Final</label><input type="datetime-local" id="dt_fim" class="doc-input"></td>
            </tr>
        </table>

        <div class="bar">Remetente</div>
        <table class="doc-table">
            <tr>
                <td width="30%"><label>CNPJ</label><input type="text" id="rem_cnpj" class="doc-input"></td>
                <td width="70%"><label>Nome</label><input type="text" id="rem_nome" class="doc-input"></td>
            </tr>
        </table>

        <div class="bar">Destinatário</div>
        <table class="doc-table">
            <tr>
                <td width="30%"><label>CNPJ</label><input type="text" id="dest_cnpj" class="doc-input"></td>
                <td width="70%"><label>Nome</label><input type="text" id="dest_nome" class="doc-input"></td>
            </tr>
        </table>

        <div class="bar">Observações</div>
        <table class="doc-table">
            <tr>
                <td><textarea id="obs_geral" rows="4" class="doc-input"></textarea></td>
            </tr>
        </table>
    </div>
</div>

<script>
    const S_URL = 'https://mcspwmajxfjzqfoxzvqu.supabase.co';
    const S_KEY = 'sb_publishable_QJG8VV2XRNfghNiylDQWcg_zUS8kQvE';
    const _supabase = supabase.createClient(S_URL, S_KEY);

    // FUNÇÃO PARA BUSCAR ORDENS NO BANCO
    async function buscarOrdens() {
        const termo = document.getElementById('busca_cnpj').value;
        if(!termo) return alert("Digite algo para buscar!");

        // Busca por CNPJ ou por Número da Coleta
        const { data, error } = await _supabase
            .from('coletas_pro')
            .select('*')
            .or(`cnpj.eq.${termo},numero_coleta.eq.${termo}`) 
            .order('data_criacao', { ascending: false });

        if(error) return alert("Erro na busca: " + error.message);

        const grid = document.getElementById('resultado_busca');
        const tabela = document.getElementById('lista-coletas');
        grid.innerHTML = "";

        if(data.length > 0) {
            tabela.style.display = "table";
            data.forEach(item => {
                grid.innerHTML += `
                    <tr>
                        <td>#${item.numero_coleta}</td>
                        <td style="font-size:11px">${item.razao_social}</td>
                        <td style="font-size:11px">${item.dest_nome}</td>
                        <td>
                            <a href="${item.url_documento}" target="_blank" class="btn-download">📥 BAIXAR PDF</a>
                        </td>
                    </tr>
                `;
            });
        } else {
            tabela.style.display = "none";
            alert("Nenhuma ordem encontrada para este termo.");
        }
    }

    // (As outras funções de salvar e gerar PDF permanecem as mesmas do código anterior)
    async function salvarBancoCompleto() { /* ... código anterior ... */ }
    function gerarPDF() { /* ... código anterior ... */ }
</script>

</body>
</html>
