<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobren Transportes | Ordem de Coleta</title>
    <link rel="icon" href="data:,">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --primary: #003366; --accent: #ffcc00; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; }
        
        /* Container Principal do Documento */
        #ordem-documento { 
            max-width: 800px; 
            margin: auto; 
            background: white; 
            border: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .header { 
            background-color: var(--primary); 
            color: white; 
            padding: 15px; 
            text-align: center; 
            border-bottom: 4px solid var(--accent); 
        }
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        .header p { margin: 5px 0 0; font-size: 12px; opacity: 0.9; }

        .form-body { padding: 20px; }

        .section-title { 
            font-size: 11px; 
            font-weight: bold; 
            color: var(--primary); 
            text-transform: uppercase; 
            background: #f8f9fa;
            border-left: 4px solid var(--accent); 
            padding: 5px 10px; 
            margin: 15px 0 10px 0; 
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full { grid-column: span 2; }

        label { display: block; font-size: 10px; margin-bottom: 3px; color: #666; font-weight: bold; text-transform: uppercase; }
        
        input, textarea { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 13px;
            background: #fff;
        }

        /* Botões */
        .no-print { padding: 0 20px 20px; display: flex; gap: 10px; }
        button { 
            flex: 1; 
            padding: 15px; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 14px;
        }
        .btn-save { background-color: #28a745; color: white; }
        .btn-download { background-color: #007bff; color: white; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .loading { color: #007bff; font-size: 10px; display: none; }

        /* REGRAS PARA O PDF (ROBUSTEZ) */
        @media print {
            body { background: white; padding: 0; }
            #ordem-documento { border: none; width: 100%; box-shadow: none; }
            .no-print { display: none !important; }
            input, textarea { border: 1px solid #eee !important; background: transparent !important; }
        }
    </style>
</head>
<body>

<div id="ordem-documento">
    <div class="header">
        <h1>JOBREN TRANSPORTES LTDA</h1>
        <p>DOCUMENTO AUXILIAR DE ORDEM DE COLETA</p>
    </div>

    <div class="form-body">
        <div class="section-title">1. Dados do Remetente (Origem)</div>
        <div class="grid">
            <div class="full">
                <label>CNPJ / CPF</label>
                <input type="text" id="rem_cnpj" onblur="buscarEmpresa('rem')" placeholder="Digite o CNPJ para buscar...">
                <span id="load_rem" class="loading">Consultando BrasilAPI...</span>
            </div>
            <div class="full"><label>Razão Social</label><input type="text" id="rem_nome"></div>
            <div class="full"><label>Endereço de Coleta</label><input type="text" id="rem_end"></div>
        </div>

        <div class="section-title">2. Dados do Destinatário (Destino)</div>
        <div class="grid">
            <div class="full">
                <label>CNPJ / CPF</label>
                <input type="text" id="dest_cnpj" onblur="buscarEmpresa('dest')" placeholder="Digite o CNPJ para buscar...">
                <span id="load_dest" class="loading">Consultando BrasilAPI...</span>
            </div>
            <div class="full"><label>Razão Social</label><input type="text" id="dest_nome"></div>
            <div class="full"><label>Endereço de Entrega</label><input type="text" id="dest_end"></div>
        </div>

        <div class="section-title">3. Detalhes da Carga e Documentação</div>
        <div class="grid">
            <div><label>Nota Fiscal (NF-e)</label><input type="text" id="nf_numero"></div>
            <div><label>Valor da Mercadoria</label><input type="text" id="valor" placeholder="R$ 0,00"></div>
            <div><label>Peso Total (KG)</label><input type="number" id="peso"></div>
            <div><label>Qtd Volumes</label><input type="number" id="volumes"></div>
            <div class="full"><label>Observações / Instruções Especiais</label>
            <textarea id="obs" rows="3"></textarea></div>
        </div>
    </div>

    <div class="no-print">
        <button class="btn-save" onclick="enviarParaSupabase()">SALVAR NO SISTEMA</button>
        <button class="btn-download" onclick="baixarPDF()">GERAR PDF (A4)</button>
    </div>
</div>

<script>
    var _supabase = null;
    const SUPABASE_URL = 'https://mcspwmajxfjzqfoxzvqu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QJG8VV2XRNfghNiylDQWcg_zUS8kQvE';

    window.onload = function() {
        if (typeof supabase !== 'undefined') {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
    };

    async function buscarEmpresa(tipo) {
        var cnpj = document.getElementById(tipo + '_cnpj').value.replace(/\D/g, '');
        if (cnpj.length !== 14) return;
        
        document.getElementById('load_' + tipo).style.display = 'inline';
        try {
            var res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
            var d = await res.json();
            if (d.razao_social) {
                document.getElementById(tipo + '_nome').value = d.razao_social;
                document.getElementById(tipo + '_end').value = `${d.logradouro}, ${d.numero} - ${d.municipio}/${d.uf}`;
            }
        } catch (e) { console.error("Erro na busca", e); }
        document.getElementById('load_' + tipo).style.display = 'none';
    }

    async function enviarParaSupabase() {
        if (!_supabase) return alert("Erro de conexão.");
        
        var dados = {
            rem_cnpj: document.getElementById('rem_cnpj').value,
            rem_nome: document.getElementById('rem_nome').value,
            dest_cnpj: document.getElementById('dest_cnpj').value,
            dest_nome: document.getElementById('dest_nome').value,
            nf_numero: document.getElementById('nf_numero').value,
            peso: document.getElementById('peso').value,
            volumes: document.getElementById('volumes').value,
            observacao: document.getElementById('obs').value,
            empresa_emitente: 'Jobren Transportes',
            data_criacao: new Date().toISOString()
        };

        try {
            const { error } = await _supabase.from('coletas_pro').insert([dados]);
            if (error) throw error;
            alert("✅ Ordem salva com sucesso!");
        } catch (e) { alert("Erro: " + e.message); }
    }

    function baixarPDF() {
        const elemento = document.getElementById('ordem-documento');
        const nf = document.getElementById('nf_numero').value || "S_NF";
        
        // Configurações para garantir página única e nitidez
        const opcoes = {
            margin: [10, 10, 10, 10],
            filename: `OC_Jobren_NF_${nf}.pdf`,
            image: { type: 'jpeg', quality: 1.0 },
            html2canvas: { 
                scale: 3, 
                logging: false, 
                useCORS: true,
                letterRendering: true 
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        // Gerar o PDF
        html2pdf().set(opcoes).from(elemento).toPdf().get('pdf').then(function (pdf) {
            // Garante que não haverá páginas em branco extras
            var totalPages = pdf.internal.getNumberOfPages();
            for (var i = totalPages; i > 1; i--) {
                pdf.deletePage(i);
            }
        }).save();
    }
</script>
</body>
</html>
